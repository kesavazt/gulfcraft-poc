name: Deploy to Azure App Service

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: gc-backend
  PYTHON_VERSION: '3.11'
  RESOURCE_GROUP: gulfcraft

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        cd backend
        python tests/test_status_agent.py || true
        python tests/test_item_search.py || true
      continue-on-error: true

    - name: Create deployment package
      run: |
        # Create a clean directory for deployment
        mkdir -p deploy_package

        # Copy necessary files
        cp -r backend deploy_package/
        cp -r templates deploy_package/
        cp requirements.txt deploy_package/

        # Create zip for deployment
        cd deploy_package
        zip -r ../deployment.zip .
        cd ..

    - name: Upload artifact for deployment
      uses: actions/upload-artifact@v4
      with:
        name: python-app
        path: deployment.zip

  deploy-to-azure:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: python-app

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: deployment.zip

    - name: Configure startup command
      run: |
        az webapp config set \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --startup-file "gunicorn -w 4 -k uvicorn.workers.UvicornWorker backend.core.api:app --bind=0.0.0.0:8000 --timeout 600"

    - name: Configure App Settings
      run: |
        az webapp config appsettings set \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --settings \
            SCM_DO_BUILD_DURING_DEPLOYMENT="true" \
            OPENAI_API_TYPE="${{ secrets.OPENAI_API_TYPE }}" \
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            AZURE_OPENAI_ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
            AZURE_OPENAI_CHAT_DEPLOYMENT_NAME="${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT_NAME }}" \
            AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME="${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME }}" \
            DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            MS_GRAPH_TENANT_ID="${{ secrets.MS_GRAPH_TENANT_ID }}" \
            MS_GRAPH_CLIENT_ID="${{ secrets.MS_GRAPH_CLIENT_ID }}" \
            MS_GRAPH_CLIENT_SECRET="${{ secrets.MS_GRAPH_CLIENT_SECRET }}" \
            MS_GRAPH_SENDER_EMAIL="${{ secrets.MS_GRAPH_SENDER_EMAIL }}" \
            LANGFUSE_SECRET_KEY="${{ secrets.LANGFUSE_SECRET_KEY }}" \
            MISTRAL_API_KEY="${{ secrets.MISTRAL_API_KEY }}" \
            AZURE_MISTRAL_ENDPOINT="${{ secrets.AZURE_MISTRAL_ENDPOINT }}" \
            AZURE_MISTRAL_API_KEY="${{ secrets.AZURE_MISTRAL_API_KEY }}" \
            VENDOR_DEFAULT_EMAIL="${{ secrets.VENDOR_DEFAULT_EMAIL }}" \
            SHAREPOINT_CLIENT_SECRET="${{ secrets.SHAREPOINT_CLIENT_SECRET }}" \
            NOTIFICATION_EMAIL="${{ secrets.NOTIFICATION_EMAIL }}" \
            GMAIL_APP_PASSWORD="${{ secrets.GMAIL_APP_PASSWORD }}"

    - name: Restart App Service
      run: |
        az webapp restart \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }}

    - name: Check deployment status
      run: |
        echo "Deployment complete!"
        echo "App URL: https://$(az webapp show --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.AZURE_WEBAPP_NAME }} --query defaultHostName -o tsv)"

    - name: Azure Logout
      run: az logout
      if: always()
