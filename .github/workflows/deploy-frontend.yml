name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, dev]
  workflow_dispatch:

env:
  BACKEND_APP_NAME: gc-backend
  RESOURCE_GROUP: gulfcraft

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Get Backend URL
      id: backend
      run: |
        # Get backend URL from Azure (requires Azure CLI to be logged in)
        # For now, use default URL - this will be set via environment variable in production
        echo "BACKEND_URL=https://${{ env.BACKEND_APP_NAME }}.azurewebsites.net" >> $GITHUB_OUTPUT

    - name: Build frontend
      run: |
        cd frontend
        echo "VITE_API_URL=${{ steps.backend.outputs.BACKEND_URL }}" > .env.production
        npm run build

    - name: Deploy to Azure Static Web Apps
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: 'upload'
        app_location: 'frontend'
        output_location: 'dist'
        skip_api_build: true

  close-pull-request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request

    steps:
    - name: Close Pull Request
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        action: 'close'
