user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
}

http {
        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        access_log /var/log/nginx/access.log;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
        gzip_min_length 256;

        # HTTP - redirect to HTTPS
        server {
                listen 80;
                server_name gc-costing.uaenorth.cloudapp.azure.com;
                return 301 https://$host$request_uri;
        }

        # HTTPS
        server {
                listen 443 ssl;
                server_name gc-costing.uaenorth.cloudapp.azure.com;

                ssl_certificate     /etc/letsencrypt/live/gc-costing.uaenorth.cloudapp.azure.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/gc-costing.uaenorth.cloudapp.azure.com/privkey.pem;

                root /home/azureadmin/gulfcraft-poc/frontend/dist;
                index index.html;

                location / {
                        try_files $uri $uri/ /index.html;
                }

                location /assets/ {
                        expires 1y;
                        add_header Cache-Control "public, immutable";
                }
        }
}
